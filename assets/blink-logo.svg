<svg width="820" height="216" viewBox="0 0 820 216" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blink">
  <defs>
    <linearGradient id="badge" x1="28" y1="30" x2="188" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BD6FF"/>
      <stop offset="0.55" stop-color="#279BFF"/>
      <stop offset="1" stop-color="#2F5BFF"/>
    </linearGradient>
    <linearGradient id="word" x1="232" y1="60" x2="560" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25D4FF"/>
      <stop offset="1" stop-color="#3A6BFF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEEFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FF9E2C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#1E63FF" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- icon badge -->
  <g filter="url(#ds)">
    <rect x="28" y="30" width="160" height="160" rx="42" fill="url(#badge)"/>
  </g>
  <rect x="28.75" y="30.75" width="158.5" height="158.5" rx="41.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- glossy top highlight -->
  <path d="M70 30h76a42 42 0 0 1 42 42v8c-40-26-120-26-160 0v-8a42 42 0 0 1 42-42z" fill="url(#gloss)"/>

  <!-- lightning bolt (Material-style) with soft glow -->
  <g transform="translate(28,38) scale(6.2)">
    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>
    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="url(#bolt)"/>
  </g>

  <!-- gold diamond spark (ArcartX brand accent) -->
  <g filter="url(#soft)"><path d="M163 56l11 14-11 14-11-14z" fill="url(#gold)" opacity="0.6"/></g>
  <path d="M163 56l11 14-11 14-11-14z" fill="url(#gold)"/>
  <path d="M163 62l5 8-5 8-5-8z" fill="#FFFFFF" opacity="0.55"/>

  <!-- wordmark -->
  <text x="230" y="132" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">Blink</text>
  <!-- tagline -->
  <text x="234" y="172" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="500" letter-spacing="3" fill="#8B95A7">闪烁 · Kotlin Spigot / Paper 插件框架</text>
</svg>
