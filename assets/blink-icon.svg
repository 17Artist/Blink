<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blink">
  <defs>
    <linearGradient id="badge" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BD6FF"/>
      <stop offset="0.55" stop-color="#279BFF"/>
      <stop offset="1" stop-color="#2F5BFF"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEEFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FF9E2C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="40" y="40" width="432" height="432" rx="104"/></clipPath>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1E63FF" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- badge -->
  <g filter="url(#ds)">
    <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#badge)"/>
  </g>
  <!-- glossy top highlight (clipped to badge) -->
  <g clip-path="url(#clip)">
    <ellipse cx="256" cy="78" rx="300" ry="150" fill="url(#gloss)"/>
  </g>
  <rect x="41.5" y="41.5" width="429" height="429" rx="102.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- lightning bolt with soft glow -->
  <g transform="translate(68,80) scale(15)">
    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="#FFFFFF" opacity="0.55" filter="url(#soft)"/>
    <path d="M7 2v11h3v9l7-12h-4l4-8z" fill="url(#bolt)"/>
  </g>

  <!-- gold diamond spark (ArcartX brand accent) -->
  <g filter="url(#soft)"><path d="M372 116l26 34-26 34-26-34z" fill="url(#gold)" opacity="0.55"/></g>
  <path d="M372 116l26 34-26 34-26-34z" fill="url(#gold)"/>
  <path d="M372 130l13 20-13 20-13-20z" fill="#FFFFFF" opacity="0.5"/>
</svg>
